<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Crear contraseña — Summer Class</title><link rel="stylesheet" href="/css/style.css"><link rel="icon" href="/assets/favicon.ico">
  <style>body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}.wrap{width:100%;max-width:420px}.logo{text-align:center;margin-bottom:22px}.logo img{height:62px;width:auto;margin:0 auto 12px}.logo p{font-size:13px}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:390px){.two-col{grid-template-columns:1fr}}</style>
</head>
<body><main class="wrap fade-up"><div class="logo"><img src="/assets/logo-nav.png" alt="Summer Class"><h1>Establece tu contraseña</h1><p>Elige una contraseña segura para acceder a tu panel.</p></div><section class="card"><div class="alert alert-error" id="alert"></div><div class="two-col"><div class="form-group"><label for="password">Contraseña</label><input id="password" type="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres"></div><div class="form-group"><label for="confirmPassword">Confirmar contraseña</label><input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Repite tu contraseña"></div></div><button type="button" class="btn btn-primary" id="submitBtn" onclick="setPassword()">Guardar contraseña</button></section></main><script>async function setPassword(){const password=document.getElementById('password').value,confirmPassword=document.getElementById('confirmPassword').value,alertBox=document.getElementById('alert'),button=document.getElementById('submitBtn'),token=location.pathname.split('/').pop();alertBox.className='alert';if(password.length<8){alertBox.textContent='La contraseña debe tener al menos 8 caracteres.';alertBox.className='alert alert-error show';return}if(password!==confirmPassword){alertBox.textContent='Las contraseñas no coinciden.';alertBox.className='alert alert-error show';return}button.disabled=true;button.innerHTML='<span class="spinner"></span>';try{const response=await fetch('/set-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password})}),data=await response.json();if(data.success)location.href=data.redirect;else{alertBox.textContent=data.error||'No se pudo guardar la contraseña.';alertBox.className='alert alert-error show';button.disabled=false;button.textContent='Guardar contraseña'}}catch(_){alertBox.textContent='Error de conexión.';alertBox.className='alert alert-error show';button.disabled=false;button.textContent='Guardar contraseña'}}</script></body>
</html>
