<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Summer Class — Excursiones Bachilleres</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
    .brand-hero { text-align:center; margin-bottom:48px; }
    .brand-icon { font-size:3.5rem; margin-bottom:14px; }
    .brand-title { font-size:clamp(2.2rem,8vw,3.5rem); font-weight:900; letter-spacing:-2px; margin-bottom:8px; }
    .brand-sub { font-size:15px; color:var(--text-2); max-width:300px; margin:0 auto 20px; }
    .plans-row { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
    .plans-row span { background:rgba(14,165,233,.08); border:1px solid rgba(14,165,233,.2); border-radius:100px; padding:5px 14px; font-size:12px; color:var(--text-2); }
    .action-cards { width:100%; max-width:380px; display:flex; flex-direction:column; gap:12px; }
    .action-btn { display:flex; align-items:center; gap:16px; background: rgba(14,165,233,0.07); border: 1px solid rgba(14,165,233,0.25); border-radius: 18px; padding: 18px 20px; cursor: pointer; text-decoration: none; transition: all .18s ease; backdrop-filter: blur(16px); position: relative; overflow: hidden; }
    .action-btn:hover { border-color: rgba(14,165,233,.5); background: rgba(14,165,233,.12); transform: translateY(-1px); box-shadow: 0 8px 28px rgba(14,165,233,.15); }
    .action-btn:active { transform: scale(0.98); }
    .action-btn.login   { border-color: rgba(34,211,238,.35); }
    .action-btn.register { background: linear-gradient(135deg, rgba(14,165,233,.12), rgba(3,105,161,.1)); border-color: rgba(14,165,233,.4); }
    .action-btn.admin   { background: rgba(255,255,255,.03); border-color: rgba(255,255,255,.1); }
    .action-btn.admin:hover { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.2); }
    .aicon { width:44px; height:44px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:1.4rem; flex-shrink:0; }
    .aicon-blue   { background: rgba(14,165,233,.15); border:1px solid rgba(14,165,233,.25); }
    .aicon-cyan   { background: linear-gradient(135deg,rgba(14,165,233,.2),rgba(34,211,238,.15)); border:1px solid rgba(34,211,238,.3); }
    .aicon-dark   { background: rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); }
    .atext-title { font-family:var(--font-title); font-size:15px; font-weight:700; color:var(--text); margin-bottom:2px; }
    .atext-sub   { font-size:12px; color:var(--text-2); }
    .achevron { margin-left:auto; color:var(--text-3); font-size:16px; flex-shrink:0; }
    .footer-note { margin-top:32px; font-size:11px; color:var(--text-3); text-align:center; }
    .footer-note a { color: var(--text-3); }
  </style>
  <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
</head>
<body>
  <div class="brand-hero fade-up">
    <img src="/assets/logo-full.png" alt="Summer Class" class="brand-logo-img">
    <p class="brand-sub">La mejor excursión de bachilleres · Eje Cafetero</p>
    <div class="plans-row">
      <span>🏝 San Andrés Islas</span>
      <span>🌊 Costa Atlántica</span>
    </div>
  </div>
  <div class="action-cards fade-up" style="animation-delay:.15s;">
    <a href="/login" class="action-btn login">
      <div class="aicon aicon-blue">🔑</div>
      <div><div class="atext-title">Iniciar sesión</div><div class="atext-sub">Accede a tu dashboard</div></div>
      <span class="achevron">›</span>
    </a>
    <a href="/registro" class="action-btn register">
      <div class="aicon aicon-cyan">✨</div>
      <div><div class="atext-title">Crear cuenta</div><div class="atext-sub">Regístrate y elige tu excursión</div></div>
      <span class="achevron">›</span>
    </a>
    <a href="/admin" class="action-btn admin">
      <div class="aicon aicon-dark">🛡</div>
      <div><div class="atext-title" style="color:var(--text-2);">Panel Admin</div><div class="atext-sub">Gestión y aprobaciones</div></div>
      <span class="achevron">›</span>
    </a>
  </div>
  <p class="footer-note">© 2026 Summer Class · Pajoy Tours · RNT 142652 · Chinchiná &nbsp;·&nbsp; <a href="/privacidad.html">Privacidad</a></p>
</body>
</html>
