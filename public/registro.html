<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Registro — Summer Class</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .two-col { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    @media(max-width:400px){ .two-col{grid-template-columns:1fr;} }
  </style>
  <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
</head>
<body>
  <nav class="topbar">
    <a href="/" class="topbar-link">← Volver</a>
    <a href="/" class="logo"><img src="/assets/logo-nav.png" alt="Summer Class" class="logo-img"></a>
    <span></span>
  </nav>
  <div class="container" style="padding-top:24px;padding-bottom:56px;">
    <div style="margin-bottom:22px;">
      <div class="section-label">Paso 1 de 2</div>
      <h2>Crea tu <span class="accent">cuenta</span></h2>
      <p style="margin-top:6px;">Solo tus datos básicos para empezar</p>
    </div>
    <div class="alert alert-error" id="alert"></div>
    <form id="registerForm">
      <div class="form-group"><label>Correo electrónico</label><input type="email" name="email" placeholder="tu@gmail.com" required autocomplete="email"></div>
      <div class="two-col">
        <div class="form-group"><label>Nombre</label><input type="text" name="first_name" placeholder="Tu nombre" required></div>
        <div class="form-group"><label>Apellidos</label><input type="text" name="last_name" placeholder="Apellidos" required></div>
      </div>
      <div class="form-group"><label>WhatsApp / Celular</label><input type="tel" name="phone" placeholder="300 123 4567" required></div>
      <div class="two-col">
        <div class="form-group">
          <label>Grado</label>
          <select name="grade" required>
            <option value="">Selecciona</option>
            <option value="9">9</option><option value="10">10</option><option value="11">11</option>
          </select>
        </div>
        <div class="form-group">
          <label>Grupo</label>
          <select name="grupo" required>
            <option value="">Grupo</option>
            <option value="A">A</option><option value="B">B</option><option value="C">C</option>
            <option value="D">D</option><option value="E">E</option>
          </select>
        </div>
      </div>
      <div class="two-col">
        <div class="form-group"><label>Ciudad</label><input type="text" name="city" placeholder="Manizales" required></div>
        <div class="form-group"><label>Colegio</label><input type="text" name="school" placeholder="Nombre del colegio" required></div>
      </div>
      <button type="submit" class="btn btn-primary" id="submitBtn">Continuar →</button>
    </form>
    <p style="text-align:center;margin-top:16px;font-size:12px;color:var(--text-3);">
      ¿Ya tienes cuenta? <a href="/login" style="color:var(--cyan);text-decoration:none;font-weight:600;">Iniciar sesión</a>
    </p>
  </div>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async e => {
      e.preventDefault();
      const al=document.getElementById('alert'); al.className='alert';
      const btn=document.getElementById('submitBtn'); btn.disabled=true; btn.innerHTML='<span class="spinner"></span>';
      const fd=new FormData(e.target);
      const data=Object.fromEntries(fd);
      data.grade = (data.grade||'') + '-' + (data.grupo||'');
      delete data.grupo;
      try{
        const res=await fetch('/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
        const json=await res.json();
        if(json.success) window.location.href=json.redirect;
        else{ al.textContent=json.error||'Error al registrar'; al.className='alert alert-error show'; btn.disabled=false; btn.textContent='Continuar →'; }
      }catch{ al.textContent='Error de conexión'; al.className='alert alert-error show'; btn.disabled=false; btn.textContent='Continuar →'; }
    });
  </script>
</body>
</html>
